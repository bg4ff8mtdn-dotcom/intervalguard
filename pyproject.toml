[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervalguard"
version = "0.1.0"
description = "Staleness-awareness for tool calls in LLM agent loops."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Michael McClary" }]
keywords = ["llm", "agents", "staleness", "temporal", "tool-calls"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/intervalguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
